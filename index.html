<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jabbloo — Engine Sandbox</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --cream: #fffdf7;
        --ink: #4a4458;
        --coral: #f98b8b;
        --lavender: #c9b6ec;
        --radius: 24px;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        padding: 20px;
        background: var(--cream);
        color: var(--ink);
        font-family: 'Baloo 2', 'Quicksand', ui-rounded, system-ui, sans-serif;
      }

      header {
        text-align: center;
      }

      .subtitle {
        margin: 0;
        max-width: 620px;
        text-align: center;
        opacity: 0.65;
        font-size: 15px;
      }

      button.ghost {
        background: transparent;
        box-shadow: inset 0 0 0 2px rgba(74, 68, 88, 0.18);
      }

      button.primary {
        background: #c9b6ec;
      }

      .editor {
        width: 100%;
        max-width: 720px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        align-items: center;
      }

      textarea {
        width: 100%;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 13px;
        line-height: 1.5;
        color: var(--ink);
        padding: 14px 16px;
        border: none;
        border-radius: var(--radius);
        background: #fff;
        box-shadow: inset 0 0 0 2px rgba(74, 68, 88, 0.1);
        resize: vertical;
      }

      textarea:focus-visible {
        outline: 3px solid var(--coral);
        outline-offset: 2px;
      }

      #status {
        margin: 0;
        font-size: 14px;
        opacity: 0.65;
        font-variant-numeric: tabular-nums;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
      }

      #stage {
        width: 100%;
        max-width: 1280px;
        flex: 1;
        min-height: 300px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* Pixi paints the battleground; this just rounds and lifts the canvas. */
      #stage canvas {
        border-radius: var(--radius);
        box-shadow: 0 10px 30px rgba(74, 68, 88, 0.16);
        display: block;
      }

      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        justify-content: center;
      }

      button {
        font: inherit;
        font-weight: 600;
        font-size: 15px;
        color: var(--ink);
        padding: 10px 22px;
        border: none;
        border-radius: 999px;
        background: #fff;
        box-shadow: 0 3px 0 rgba(74, 68, 88, 0.14);
        cursor: pointer;
        transition: transform 0.12s ease, box-shadow 0.12s ease;
      }

      button:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 0 rgba(74, 68, 88, 0.14);
      }

      button:active {
        transform: translateY(1px);
        box-shadow: 0 1px 0 rgba(74, 68, 88, 0.14);
      }

      button[aria-pressed='true'] {
        background: var(--lavender);
      }

      button:focus-visible {
        outline: 3px solid var(--coral);
        outline-offset: 2px;
      }

      @media (prefers-reduced-motion: reduce) {
        button {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <p class="subtitle">
        <strong>Engine sandbox</strong> — a development workbench, not a game screen.
        Fire each primitive to see how it reads.
      </p>
    </header>

    <main id="stage" aria-label="Battle stage preview"></main>

    <nav class="controls" id="moves" aria-label="Animation primitives"></nav>

    <section class="editor" aria-label="Choreography">
      <div class="controls" id="presets"></div>
      <label class="sr-only" for="choreography">Choreography JSON</label>
      <textarea id="choreography" spellcheck="false" rows="10"></textarea>
      <div class="controls">
        <button id="play" class="primary">▶ Play choreography</button>
        <p id="status" role="status" aria-live="polite">ready</p>
      </div>
    </section>

    <nav class="controls" id="grounds" aria-label="Battleground selection"></nav>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
